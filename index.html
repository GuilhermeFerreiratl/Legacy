<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador Satoshi Legacy - CORRIGIDO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:monospace;padding:20px;text-align:center}
button{background:#f7931a;color:#000;border:none;padding:16px 25px;font-size:18px;font-weight:bold;border-radius:10px}
.box{background:#1a1a1a;padding:15px;border-radius:10px;margin-top:15px;word-break:break-all;text-align:left}
.vermelho{color:#ff5a5a;font-weight:bold}
.laranja{color:#ff9f2e;font-weight:bold}
.verde{color:#2ecc71}
.label{color:#aaa;font-size:12px}
input{width:100%;background:#000;color:#fff;border:1px solid #333;padding:10px;margin-top:8px;font-family:monospace}
.ok{color:#2ecc71;font-weight:bold}
</style>
</head>
<body>
<h2>Gerador Legacy P2PKH - Checksum Válido</h2>
<p>Estilo Satoshi - Chave 5... + Endereço 1...</p>
<button onclick="gerar()">GERAR NOVA</button>

<div class="box">
<div class="label">CHAVE PRIVADA - NUNCA MOSTRE</div>
<div id="priv">Clique em GERAR</div>
<input id="privCopy" readonly onclick="this.select()">
<div id="validacao"></div>
</div>

<div class="box">
<div class="label">ENDEREÇO 1... - PODE RECEBER</div>
<div id="addr">---</div>
<input id="addrCopy" readonly onclick="this.select()">
</div>

<script>
const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

// --- CORREÇÃO 1: Conversão bytes <-> Hex correta ---
function bytesToHex(bytes){
  let h = "";
  for(let i=0;i<bytes.length;i++){ h += ("0"+bytes[i].toString(16)).slice(-2); }
  return h;
}
function hexToBytes(hex){
  let out = [];
  for(let i=0;i<hex.length;i+=2) out.push(parseInt(hex.substr(i,2),16));
  return out;
}
function base58Encode(bytes){
  let hex = bytesToHex(bytes);
  let bi = BigInt("0x"+hex);
  let s = "";
  if(bi===0n) return "1";
  while(bi>0n){ let mod = bi % 58n; s = ALPHABET[Number(mod)] + s; bi = bi / 58n; }
  for(let i=0;i<bytes.length && bytes[i]===0;i++){ s = "1"+s; }
  return s;
}
function base58Decode(str){
  let n = 0n;
  for(let c of str){ n = n*58n + BigInt(ALPHABET.indexOf(c)); }
  let hex = n.toString(16);
  if(hex.length % 2 === 1) hex = "0"+hex;
  let bytes = hexToBytes(hex);
  let pad = 0;
  for(let c of str){ if(c==="1") pad++; else break; }
  return new Array(pad).fill(0).concat(bytes);
}

// --- CORREÇÃO 2: SHA256 e RIPEMD usando Hex.parse, não WordArray.create ---
function sha256Bytes(bytes){
  let hex = bytesToHex(bytes);
  let wa = CryptoJS.enc.Hex.parse(hex);
  let h = CryptoJS.SHA256(wa);
  return hexToBytes(h.toString(CryptoJS.enc.Hex));
}
function ripemdBytes(bytes){
  let hex = bytesToHex(bytes);
  let wa = CryptoJS.enc.Hex.parse(hex);
  let h = CryptoJS.RIPEMD160(wa);
  return hexToBytes(h.toString(CryptoJS.enc.Hex));
}
function checkEncode(versionByte, payload){
  let data = [versionByte].concat(payload);
  let c1 = sha256Bytes(data);
  let c2 = sha256Bytes(c1);
  let full = data.concat(c2.slice(0,4));
  return base58Encode(full);
}
// Valida checksum na hora
function validaChecksum(wif){
  try{
    let dec = base58Decode(wif);
    if(dec.length !== 37) return false;
    let payload = dec.slice(0, dec.length-4);
    let dado = dec.slice(dec.length-4);
    let calc = sha256Bytes(sha256Bytes(payload)).slice(0,4);
    return bytesToHex(dado) === bytesToHex(calc);
  }catch(e){ return false; }
}

function gerar(){
  try{
    let priv = new Uint8Array(32);
    window.crypto.getRandomValues(priv);
    let privArr = Array.from(priv);
    let wif = checkEncode(0x80, privArr);

    let ec = new elliptic.ec('secp256k1');
    let key = ec.keyFromPrivate(priv);
    let pubHex = key.getPublic(false, 'hex');
    let pubBytes = hexToBytes(pubHex);

    let h1 = sha256Bytes(pubBytes);
    let h160 = ripemdBytes(h1);
    let addr = checkEncode(0x00, h160);

    let colorido = '<span class="vermelho">'+wif.slice(0,2)+'</span><span class="laranja">'+wif.slice(2,3)+'</span><span class="verde">'+wif.slice(3)+'</span>';
    document.getElementById('priv').innerHTML = colorido;
    document.getElementById('privCopy').value = wif;
    document.getElementById('addr').innerHTML = '<b style="font-size:18px">'+addr+'</b>';
    document.getElementById('addrCopy').value = addr;

    let ok = validaChecksum(wif);
    document.getElementById('validacao').innerHTML = ok ? '<div class="ok">✅ Checksum VÁLIDO - Pode importar em qualquer carteira</div>' : '<div style="color:red">❌ Checksum INVÁLIDO</div>';

  }catch(e){
    document.getElementById('priv').innerHTML = "Erro: "+e.message+"<br>Abre no Chrome, não no visualizador do WhatsApp.";
  }
}
</script>
</body>
</html>
